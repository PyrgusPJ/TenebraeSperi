<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Area riservata</title>
<style>
:root{--bg:#120e0b;--panel:#1c1511;--ink:#e6d8bd;--mute:#9b8a70;--accent:#c4452b;--gold:#b58a35;--line:#3f3126;--shadow:rgba(0,0,0,.6);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-mode]){--bg:#e4d6b6;--panel:#f2e7cc;--ink:#2a1f14;--mute:#76654d;--accent:#8c2f1b;--gold:#8f6a1a;--line:#c2ad82;--shadow:rgba(60,40,10,.2)}}
:root[data-mode="day"]{--bg:#e4d6b6;--panel:#f2e7cc;--ink:#2a1f14;--mute:#76654d;--accent:#8c2f1b;--gold:#8f6a1a;--line:#c2ad82;--shadow:rgba(60,40,10,.2)}
:root[data-mode="night"]{--bg:#120e0b;--panel:#1c1511;--ink:#e6d8bd;--mute:#9b8a70;--accent:#c4452b;--gold:#b58a35;--line:#3f3126;--shadow:rgba(0,0,0,.6)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Palatino Linotype',serif;line-height:1.6}
h1,h2,h3,.cap{font-family:'Cinzel',Georgia,serif;letter-spacing:.04em}
header{position:relative;padding:22px 20px 14px;text-align:center;border-bottom:2px double var(--gold);background:radial-gradient(ellipse at top,var(--panel),var(--bg))}
header h1{margin:0;font-size:clamp(1.9rem,5.4vw,2.3rem);color:var(--accent)}
header p{margin:4px 0 0;color:var(--mute);font-style:italic;font-size:.95rem}
.bar{display:flex;gap:10px;max-width:1100px;margin:14px auto;padding:0 16px;flex-wrap:wrap}
input,textarea,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
.bar input{flex:1;min-width:200px}
button{font:inherit;cursor:pointer;border:1px solid var(--gold);background:var(--panel);color:var(--ink);border-radius:6px;padding:8px 14px}
button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
button:hover{filter:brightness(1.08)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;max-width:1100px;margin:0 auto;padding:0 16px}
.tab{padding:5px 12px;border-radius:999px;font-size:.9rem}
.subtabs{margin-top:8px}.subtabs .tab{font-size:.8rem;padding:3px 10px}.tab.on{background:var(--gold);color:#fff;border-color:var(--gold)}
main{max-width:1100px;margin:16px auto 40px;padding:0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;box-shadow:0 2px 8px var(--shadow);transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.thumb{height:120px;background:linear-gradient(135deg,var(--line),var(--panel));display:flex;align-items:center;justify-content:center;font-size:2.4rem}
.thumb img{width:100%;height:100%;object-fit:cover}
.card .t{padding:10px 12px}
.card h3{margin:0;font-size:1.05rem}
.badge{font-size:.72rem;color:var(--gold);text-transform:uppercase;letter-spacing:.1em}
.card p{margin:4px 0 0;color:var(--mute);font-size:.88rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.view{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;box-shadow:0 2px 8px var(--shadow)}
.view h2{margin:.2em 0 .1em;font-size:1.8rem;color:var(--accent)}
.view img.hero{max-width:100%;max-height:380px;border-radius:8px;border:1px solid var(--line);display:block;margin:12px 0}
.lnk{color:var(--accent);border-bottom:1px dashed var(--accent);cursor:pointer}
.lnk.miss{color:var(--mute);border-bottom-color:var(--mute);font-style:italic}
.back{margin:10px 0 0;color:var(--mute);font-size:.9rem}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.empty{text-align:center;color:var(--mute);padding:40px 10px;font-style:italic}
dialog{border:2px solid var(--gold);border-radius:12px;background:var(--panel);color:var(--ink);width:min(560px,94vw);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;margin:10px 0 3px;font-size:.85rem;color:var(--mute)}
textarea{min-height:170px;resize:vertical}
.hint{font-size:.8rem;color:var(--mute);margin-top:4px}
.mapwrap{position:relative;line-height:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mapwrap img{width:100%;display:block}
.mapwrap.placing{cursor:crosshair;outline:3px solid var(--accent)}
.pin{position:absolute;transform:translate(-50%,-100%);cursor:pointer;font-size:1.5rem;line-height:1}
.pin b{position:absolute;top:100%;left:50%;transform:translateX(-50%);font:600 .68rem Georgia,serif;background:var(--panel);color:var(--ink);border:1px solid var(--gold);border-radius:4px;padding:0 4px;white-space:nowrap}
.st{display:inline-block;margin-left:6px;color:var(--accent)}
#sdlg{max-height:88vh;overflow:auto}
.srow{display:flex;gap:6px;margin-bottom:6px}.srow .ci{width:64px;flex:none;text-align:center}
.mini{font-size:.85rem;padding:4px 10px}
.pc{width:64px!important;flex:none;padding:2px;height:34px;cursor:pointer}
.cl{align-self:center}
#logo{cursor:pointer;position:absolute;right:18px;top:50%;transform:translateY(-50%);max-height:72px;max-width:130px;object-fit:contain}
@media (max-width:600px){#logo{position:static;transform:none;display:block;margin:0 auto 8px;max-height:60px}}
#st{font-size:.8rem;color:var(--mute);text-align:center;margin-top:8px}
</style>
</head>
<body>
<div id="lock" style="position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px">
  <div class="view" style="max-width:360px;width:100%;text-align:center">
    <h2 style="margin:0 0 6px">🔒 Area riservata</h2>
    <p style="color:var(--mute);margin:0 0 14px">Inserisci la parola d'ordine per entrare.</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Parola d'ordine">
    <label style="display:flex;gap:8px;align-items:center;justify-content:center;margin:10px 0 0;font-size:.9rem"><input type="checkbox" id="shw" style="width:auto"> Mostra password</label>
    <label style="display:flex;gap:8px;align-items:center;justify-content:center;margin:8px 0 12px;font-size:.9rem"><input type="checkbox" id="rem" style="width:auto"> Ricordami su questo dispositivo</label>
    <button class="pri" id="go" style="width:100%">Entra</button>
    <div id="pwe" style="color:var(--accent);min-height:1.5em;margin-top:8px"></div>
  </div>
</div>
<header>
  <img id="logo" alt="" style="display:none">
  <h1 id="ttl"></h1>
  <p id="sbt"></p>
</header>
<div class="bar">
  <input id="q" type="search" placeholder="Cerca un nome, un luogo, una parola…">
  <button class="pri" id="add" style="display:none">+ Nuova voce</button>
  <button id="modeb" title="Cambia modalità notte/giorno"></button>
  <button id="setb" style="display:none">⚙ Impostazioni</button>
</div>
<div class="tabs" id="tabs"></div><div class="tabs subtabs" id="subtabs"></div>
<main><div id="out"></div><div id="st"></div></main>

<dialog id="dlg">
  <h3 id="dt" style="margin-top:0">Voce</h3>
  <label>Nome</label><input id="fn">
  <label>Icona (un emoji, facoltativa)</label><input id="fi" maxlength="4" placeholder="es. 🐻 ⚔ 🏰">
  <label>Categoria</label><select id="fc"></select>
  <div id="statbox" style="display:none"><label>Stato missione</label><select id="fst"></select></div>
  <div id="subbox" style="display:none"><label>Gruppo</label><select id="fs"></select></div>
  <label>Descrizione</label><textarea id="fb"></textarea>
  <div class="hint">Per collegare un'altra voce scrivi il suo nome tra doppie quadre, ad esempio [[Nome della voce]].</div>
  <div id="imgbox"><label>Immagine (disegno, mappa, ritratto)</label><input type="file" id="ff" accept="image/*"></div>
  <div class="row"><button class="pri" id="save">Salva</button><button id="cancel">Annulla</button></div>
</dialog>

<dialog id="cdlg">
  <p id="cmsg" style="margin-top:0"></p>
  <div class="row"><button class="pri" id="cok">Elimina</button><button id="cno">Annulla</button></div>
</dialog>

<dialog id="pdlg">
  <h3 style="margin-top:0">📍 Nuovo segnaposto</h3>
  <label>Collega a una voce</label><select id="pe"></select>
  <label>Oppure scrivi un'etichetta</label><input id="pl" placeholder="es. Grotta misteriosa">
  <div class="row"><button class="pri" id="psave">Salva</button><button id="pcancel">Annulla</button></div>
</dialog>

<dialog id="sdlg">
  <h3 style="margin-top:0">⚙ Impostazioni</h3>
  <label>Titolo</label><input id="stt">
  <label>Sottotitolo</label><input id="sts">
  <label>Categorie (icona e nome)</label><div id="scats"></div><button class="mini" id="addcat">+ Categoria</button>
  <label>Gruppi (per categoria)</label><div id="sgrp"></div>
  <label>Stati delle missioni</label><div id="sstat"></div>
  <div id="slbox"><label>Logo (in alto a destra)</label>
  <div class="row" style="margin:0 0 8px;align-items:center"><img id="slp" alt="" style="height:44px;display:none;border-radius:4px"><input type="file" id="slf" accept="image/*" style="flex:1"><button class="mini" id="slx">Rimuovi</button></div></div>
  <label>Colori</label>
  <div id="smode" class="row" style="margin:0 0 8px"></div>
  <div id="spre" class="row" style="margin:0 0 8px"></div>
  <div id="scol"></div>
  <div class="hint">Cambiare un nome non tocca le voci già scritte: restano al loro posto.</div>
  <div class="row"><button class="pri" id="ssave">Salva</button><button id="scancel">Annulla</button></div>
</dialog>

<script>
const CATS={"pg":["🛡","PG"],"npc":["🎭","NPC"],"luoghi":["🏰","Luoghi di interesse"],"assoc":["🕯","Associazioni"],"missioni":["📜","Missioni"],"sessioni":["📖","Sessioni"]};
const GROUPS={};
const STAT={"corso":"🔥 In corso","completata":"✅ Completata","fallita":"💀 Fallita","sospesa":"⏳ In sospeso"};
let entries=[],pins=[],mapImg="",placing=false,pend=null,cat="all",sub="all",cur=null,editId=null,db=null,assets=null,canWrite=true;
const ask=msg=>new Promise(res=>{const d=$("cdlg");$("cmsg").textContent=msg;$("cok").onclick=()=>{d.close();res(true)};$("cno").onclick=()=>{d.close();res(false)};d.oncancel=()=>res(false);d.showModal()});
let sayT=null;
const say=m=>{const t=$("st");t.textContent=m;t.style.color="var(--accent)";clearTimeout(sayT);sayT=setTimeout(()=>{t.textContent="";t.style.color=""},6000)};
const ico=e=>e.icon||(CATS[e.cat]||["📖"])[0];
const tag=e=>((CATS[e.cat]||["","Altro"])[1])+(GROUPS[e.cat]?.[e.sub]?" · "+GROUPS[e.cat][e.sub]:"")+(e.cat==="missioni"&&STAT[e.status]?" · "+STAT[e.status]:"");
const DEF={title:"Enciclopedia",sub:"",cats:JSON.parse(JSON.stringify(CATS)),groups:JSON.parse(JSON.stringify(GROUPS)),stat:JSON.parse(JSON.stringify(STAT))};
const pinLabel=p=>{const e=entries.find(x=>x.id===p.entry);return e?e.name:(p.label||"Segnaposto")};

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s).trim().toLowerCase();
const byName=n=>entries.find(e=>norm(e.name)===norm(n));

function body(t){return esc(t).replace(/\[\[([^\]]+)\]\]/g,(m,n)=>{const e=byName(n.replace(/&amp;/g,"&").replace(/&#39;/g,"'"));return e?`<span class="lnk" data-id="${esc(e.id)}">${n}</span>`:`<span class="lnk miss" data-new="${n}" title="Voce non ancora creata">${n}</span>`}).replace(/\n/g,"<br>")}

function render(){
  const q=norm($("q").value);
  const subs=cat==="missioni"?STAT:(GROUPS[cat]&&Object.keys(GROUPS[cat]).length?GROUPS[cat]:null);
  $("subtabs").innerHTML=subs?`<button class="tab ${sub==="all"?"on":""}" data-s="all">Tutte</button>`+Object.entries(subs).map(([k,l])=>`<button class="tab ${sub===k?"on":""}" data-s="${k}">${l}</button>`).join(""):"";
  $("tabs").innerHTML=`<button class="tab ${cat==="all"?"on":""}" data-c="all">Tutto</button>`+Object.entries(CATS).map(([k,[i,l]])=>`<button class="tab ${cat===k?"on":""}" data-c="${k}">${i} ${l}</button>`).join("")+`<button class="tab ${cat==="mappa"?"on":""}" data-c="mappa">🗺 Mappa</button>`;
  const out=$("out");
  if(cat==="mappa"&&!cur)return renderMap();
  if(cur){const e=entries.find(x=>x.id===cur);if(!e){cur=null;return render()}
    const back=entries.filter(x=>x.id!==e.id&&norm(x.body||"").includes("[["+norm(e.name)+"]]"));
    out.innerHTML=`<div class="view"><button data-back>← Indietro</button>
    <div class="badge" style="margin-top:12px">${ico(e)} ${tag(e)}</div>
    <h2>${esc(e.name)}</h2>${e.img?`<img class="hero" src="${blob(e.img)}" alt="">`:""}
    <div>${body(e.body)}</div>
    ${back.length?`<div class="back">Citato in: ${back.map(b=>`<span class="lnk" data-id="${esc(b.id)}">${esc(b.name)}</span>`).join(", ")}</div>`:""}
    ${canWrite?`<div class="row"><button data-edit="${esc(e.id)}">✎ Modifica</button><button data-del="${esc(e.id)}">🗑 Elimina</button></div>`:""}</div>`;return}
  const list=entries.filter(e=>(cat==="all"||e.cat===cat)&&(sub==="all"||e.sub===sub||e.status===sub)&&(!q||norm(e.name+" "+(e.body||"")).includes(q))).sort((a,b)=>a.name.localeCompare(b.name,"it"));
  out.innerHTML=list.length?`<div class="grid">${list.map(e=>`<div class="card" data-id="${esc(e.id)}"><div class="thumb">${e.img?`<img src="${blob(e.img)}" alt="">`:ico(e)}</div><div class="t"><div class="badge">${tag(e)}</div><h3>${esc(e.name)}</h3><p>${esc((e.body||"").replace(/\[\[|\]\]/g,""))}</p></div></div>`).join("")}</div>`:`<div class="empty">Nessuna voce trovata. ${canWrite?"Creane una con “+ Nuova voce”.":""}</div>`;
}

function renderMap(){
  const lab=p=>esc(pinLabel(p));
  $("out").innerHTML=`<div class="view">${mapImg?`<div class="mapwrap ${placing?"placing":""}" id="mw"><img src="${blob(mapImg)}" alt="Mappa">${pins.map(p=>`<span class="pin" data-pin="${esc(p.id)}" style="left:${p.x}%;top:${p.y}%">📍<b>${lab(p)}</b></span>`).join("")}</div>`:`<div class="empty">Nessuna mappa caricata${canWrite&&assets?". Caricala con il pulsante qui sotto.":"."}</div>`}
  ${canWrite?`<div class="row">${assets?`<button data-mapup>🖼 ${mapImg?"Cambia":"Carica"} mappa</button><input type="file" id="mapf" accept="image/*" style="display:none">`:""}${mapImg?`<button class="${placing?"pri":""}" data-place>${placing?"Clicca sulla mappa… (annulla)":"📍 Aggiungi segnaposto"}</button>`:""}</div>`:""}
  ${pins.length?`<div class="back">Segnaposto: ${pins.map(p=>`<span class="lnk" data-pin="${esc(p.id)}">${lab(p)}</span>${canWrite?` <span data-pdel="${esc(p.id)}" style="cursor:pointer" title="Elimina">✕</span>`:""}`).join(" · ")}</div>`:""}</div>`;
}
function openPin(){
  const opts=[...entries].sort((a,b)=>(a.cat==="luoghi"?0:1)-(b.cat==="luoghi"?0:1)||a.name.localeCompare(b.name,"it"));
  $("pe").innerHTML=`<option value="">— nessuna voce, solo etichetta —</option>`+opts.map(e=>`<option value="${esc(e.id)}">${esc(e.name)}</option>`).join("");
  $("pl").value="";$("pdlg").showModal();
}
document.addEventListener("change",async ev=>{
  if(ev.target.id!=="mapf"||!ev.target.files[0])return;
  try{const r=await assets.upload(ev.target.files[0]);await db.collection("settings").doc("map").set({img:r.id})}catch(e){say("Caricamento non riuscito")}
});
document.addEventListener("click",ev=>{
  const mw=ev.target.closest("#mw");
  if(placing&&mw&&!ev.target.closest("[data-pin]")){const r=mw.getBoundingClientRect();pend={x:+((ev.clientX-r.left)/r.width*100).toFixed(2),y:+((ev.clientY-r.top)/r.height*100).toFixed(2)};return openPin()}
  const m=ev.target.closest("[data-mapup],[data-place],[data-pin],[data-pdel]");
  if(m){
    if(m.hasAttribute("data-mapup"))return $("mapf").click();
    if(m.hasAttribute("data-place")){placing=!placing;return render()}
    if(m.dataset.pdel){ask("Eliminare il segnaposto?").then(ok=>{if(ok)db.collection("pins").doc(m.dataset.pdel).delete().catch(()=>say("Eliminazione non riuscita"))});return}
    const p=pins.find(x=>x.id===m.dataset.pin);if(!p)return;
    if(entries.find(x=>x.id===p.entry)){cur=p.entry;scrollTo(0,0);return render()}
    return say(p.label||"Segnaposto");
  }
  const t=ev.target.closest("[data-id],[data-c],[data-s],[data-back],[data-edit],[data-del],[data-new]");if(!t)return;
  if(t.dataset.s){sub=t.dataset.s;cur=null}
  else if(t.dataset.c){cat=t.dataset.c;sub="all";cur=null}
  else if(t.dataset.id){cur=t.dataset.id;scrollTo(0,0)}
  else if(t.hasAttribute("data-back"))cur=null;
  else if(t.dataset.edit)return openEd(t.dataset.edit);
  else if(t.dataset.del)return del(t.dataset.del);
  else if(t.dataset.new){if(canWrite)return openEd(null,t.dataset.new);return}
  render();
});
$("q").addEventListener("input",()=>{cur=null;render()});
function fillSel(){
$("fst").innerHTML=Object.entries(STAT).map(([k,l])=>`<option value="${k}">${l}</option>`).join("");
$("fc").innerHTML=Object.entries(CATS).map(([k,[i,l]])=>`<option value="${k}">${i} ${l}</option>`).join("");
syncBoxes();
}
fillSel();
function syncBoxes(){
  const c=$("fc").value,g=GROUPS[c]||{},ks=Object.keys(g),cu=$("fs").value;
  $("fs").innerHTML=`<option value="">— nessuno —</option>`+ks.map(k=>`<option value="${esc(k)}">${esc(g[k])}</option>`).join("");
  if(g[cu])$("fs").value=cu;
  $("subbox").style.display=ks.length?"block":"none";$("statbox").style.display=c==="missioni"?"block":"none";
}
$("fc").onchange=syncBoxes;
$("pcancel").onclick=()=>{$("pdlg").close()};
$("psave").onclick=async()=>{
  const entry=$("pe").value,label=$("pl").value.trim();
  if(!entry&&!label)return $("pl").focus();
  try{await db.collection("pins").add({x:pend.x,y:pend.y,entry,label});placing=false;$("pdlg").close();render()}catch(e){say("Salvataggio non riuscito")}
};

function applyConfig(c){
  const set=(o,src)=>{Object.keys(o).forEach(k=>delete o[k]);Object.assign(o,src)};
  set(CATS,c?.cats?Object.fromEntries(c.cats.map(([k,i,l])=>[k,[i,l]])):DEF.cats);
  set(GROUPS,c?.groups?Object.fromEntries(Object.entries(c.groups).map(([k,a])=>[k,Object.fromEntries(a)])):(c?.subs?{npc:Object.fromEntries(c.subs)}:DEF.groups));
  set(STAT,c?.stat?Object.fromEntries(c.stat):DEF.stat);
  $("ttl").textContent=c?.title||DEF.title;$("sbt").textContent=c?.sub??DEF.sub;
  document.title=$("ttl").textContent;fillSel();curPal=normPal(c?.colors);refreshTheme();curLogo=c?.logo||"";applyLogo(curLogo);
}
const srow=(k,i,n,ic)=>`<div class="srow" data-k="${esc(k)}">${ic?`<input class="ci" maxlength="4" value="${esc(i)}">`:""}<input class="cn" value="${esc(n)}"></div>`;
const gather=(box,ic,old)=>{const o={};box.querySelectorAll(".srow").forEach(r=>{const k=r.dataset.k;const n=r.querySelector(".cn").value.trim()||(old[k]?(ic?old[k][1]:old[k]):"");if(!n)return;o[k]=ic?[r.querySelector(".ci").value.trim()||"📖",n]:n});return o};
const PRE={"Notte oscura":{bg:"#120e0b",panel:"#1c1511",ink:"#e6d8bd",accent:"#c4452b",gold:"#b58a35"},"Pergamena":{bg:"#e4d6b6",panel:"#f2e7cc",ink:"#2a1f14",accent:"#8c2f1b",gold:"#8f6a1a"},"Foresta":{bg:"#0d1410",panel:"#16211a",ink:"#d6e2cf",accent:"#6fa35a",gold:"#b9a14a"},"Sangue e ferro":{bg:"#110d0e",panel:"#1d1517",ink:"#e2d6d6",accent:"#d13b3b",gold:"#8d96a3"},"Gelo":{bg:"#0c1118",panel:"#141c27",ink:"#dce6f0",accent:"#5aa7d6",gold:"#9bb5c9"}};
const CK=[["bg","Sfondo"],["panel","Schede e pannelli"],["ink","Testo"],["accent","Accento (titoli e link)"],["gold","Dettagli dorati"]];
let curPal={night:null,day:null},palx={night:null,day:null},emode="night";
const DEFPAL={night:PRE["Notte oscura"],day:PRE["Pergamena"]};
const lum=h=>{const n=parseInt(h.slice(1),16);return .299*(n>>16)+.587*((n>>8)&255)+.114*(n&255)};
const normPal=x=>!x?{night:null,day:null}:x.bg?(lum(x.bg)>128?{night:null,day:x}:{night:x,day:null}):{night:x.night||null,day:x.day||null};
function applyColors(c){
  const st=document.documentElement.style;
  CK.forEach(([k])=>c?st.setProperty("--"+k,c[k]):st.removeProperty("--"+k));
  if(c){st.setProperty("--line",`color-mix(in srgb,${c.ink} 22%,${c.bg})`);st.setProperty("--mute",`color-mix(in srgb,${c.ink} 62%,${c.bg})`);st.setProperty("--shadow","rgba(0,0,0,.5)")}
  else["line","mute","shadow"].forEach(k=>st.removeProperty("--"+k));
}
const getMode=()=>{let m=null;try{m=localStorage.getItem("mode")}catch(e){}return m==="day"||m==="night"?m:(matchMedia("(prefers-color-scheme: light)").matches?"day":"night")};
function refreshTheme(m){m=m||getMode();document.documentElement.setAttribute("data-mode",m);applyColors(curPal[m]||null);$("modeb").textContent=m==="night"?"☀ Giorno":"🌙 Notte"}
$("modeb").onclick=()=>{const m=getMode()==="night"?"day":"night";try{localStorage.setItem("mode",m)}catch(e){}refreshTheme(m)};
const readPick=()=>{const o={};document.querySelectorAll("#scol .pc").forEach(i=>o[i.dataset.c]=i.value);return o};
const setPick=c=>document.querySelectorAll("#scol .pc").forEach(i=>{i.value=c[i.dataset.c]});
const renderModeTabs=()=>{$("smode").innerHTML=`<button class="mini ${emode==="night"?"pri":""}" data-m="night">🌙 Notte</button><button class="mini ${emode==="day"?"pri":""}" data-m="day">☀ Giorno</button>`};
const previewPal=()=>{document.documentElement.setAttribute("data-mode",emode);applyColors(palx[emode]||null)};
$("scol").addEventListener("input",()=>{palx[emode]=readPick();previewPal()});
$("smode").addEventListener("click",ev=>{const b=ev.target.closest("[data-m]");if(!b)return;emode=b.dataset.m;renderModeTabs();setPick(palx[emode]||DEFPAL[emode]);previewPal()});
$("spre").addEventListener("click",ev=>{
  const b=ev.target.closest("[data-pre]");
  if(b){palx[emode]=PRE[b.dataset.pre];setPick(palx[emode]);previewPal()}
  if(ev.target.closest("[data-rst]")){palx[emode]=null;setPick(DEFPAL[emode]);previewPal()}
});
$("sdlg").addEventListener("close",()=>refreshTheme());
refreshTheme();
let curLogo="",newLogo=null;
function applyLogo(id){const l=$("logo");l.style.display=id?"block":"none";if(id)l.src=blob(id)}
function showLogo(id){const i=$("slp");i.style.display=id?"block":"none";if(id)i.src=blob(id)}
$("slf").onchange=async()=>{const f=$("slf").files[0];if(!f)return;try{const r=await assets.upload(f);newLogo=r.id;showLogo(newLogo)}catch(e){say("Caricamento non riuscito")}};
$("slx").onclick=()=>{newLogo="";$("slf").value="";showLogo("")};
function openSet(){
  newLogo=null;showLogo(curLogo);$("slbox").style.display=assets?"block":"none";
  $("stt").value=$("ttl").textContent;$("sts").value=$("sbt").textContent;
  $("scats").innerHTML=Object.entries(CATS).map(([k,[i,l]])=>srow(k,i,l,1)).join("");
  $("sgrp").innerHTML=Object.entries(CATS).filter(([k])=>k!=="missioni").map(([k,[i,l]])=>`<div class="gb" data-cat="${esc(k)}"><div class="hint" style="margin-top:8px">${esc(i)} ${esc(l)}</div><div class="grows">${Object.entries(GROUPS[k]||{}).map(([gk,gl])=>srow(gk,"",gl,0)).join("")}</div><button class="mini" data-addg="${esc(k)}">+ Gruppo</button></div>`).join("");
  $("sstat").innerHTML=Object.entries(STAT).map(([k,l])=>srow(k,"",l,0)).join("");
  palx=JSON.parse(JSON.stringify(curPal));emode=getMode();renderModeTabs();
  $("spre").innerHTML=Object.keys(PRE).map(n=>`<button class="mini" data-pre="${esc(n)}">${esc(n)}</button>`).join("")+`<button class="mini" data-rst>↺ Originali</button>`;
  $("scol").innerHTML=CK.map(([k,l])=>`<div class="srow"><input type="color" class="pc" data-c="${k}"><span class="cl">${l}</span></div>`).join("");
  setPick(palx[emode]||DEFPAL[emode]);previewPal();
  $("sdlg").showModal();
}
$("setb").onclick=openSet;
$("scancel").onclick=()=>$("sdlg").close();
$("addcat").onclick=()=>$("scats").insertAdjacentHTML("beforeend",srow("n"+Date.now().toString(36),"📖","",1));
$("sgrp").addEventListener("click",ev=>{const b=ev.target.closest("[data-addg]");if(b)b.parentElement.querySelector(".grows").insertAdjacentHTML("beforeend",srow("g"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),"","",0))});
$("ssave").onclick=async()=>{
  const cats=gather($("scats"),1,CATS),stat=gather($("sstat"),0,STAT);
  const groups={};document.querySelectorAll("#sgrp .gb").forEach(b=>{const k=b.dataset.cat;groups[k]=Object.entries(gather(b.querySelector(".grows"),0,GROUPS[k]||{}))});
  const cfg={title:$("stt").value.trim()||DEF.title,sub:$("sts").value.trim(),cats:Object.entries(cats).map(([k,[i,l]])=>[k,i,l]),groups,stat:Object.entries(stat),logo:newLogo===null?curLogo:newLogo,colors:{night:palx.night||null,day:palx.day||null}};
  curPal=normPal(cfg.colors);curLogo=cfg.logo;applyLogo(curLogo);
  try{await db.collection("settings").doc("config").set(cfg);$("sdlg").close()}catch(e){say("Salvataggio non riuscito")}
};
function openEd(id,name){
  editId=id;const e=id?entries.find(x=>x.id===id):null;
  $("dt").textContent=e?"Modifica voce":"Nuova voce";
  $("fn").value=e?e.name:(name||"");$("fc").value=e?e.cat:(CATS[cat]?cat:"npc");syncBoxes();$("fs").value=(e?e.sub:(GROUPS[$("fc").value]?.[sub]?sub:($("fc").value==="npc"?"comune":"")))||"";$("fi").value=e?.icon||"";$("fst").value=e?.status||(STAT[sub]?sub:"corso");syncBoxes();$("fb").value=e?e.body||"":"";$("ff").value="";
  $("imgbox").style.display=assets?"block":"none";$("dlg").showModal();
}
$("add").onclick=()=>openEd(null);
$("cancel").onclick=()=>$("dlg").close();
$("save").onclick=async()=>{
  const name=$("fn").value.trim();if(!name)return $("fn").focus();
  const old=editId?entries.find(x=>x.id===editId):null;
  const data={name,cat:$("fc").value,sub:(GROUPS[$("fc").value]&&Object.keys(GROUPS[$("fc").value]).length)?$("fs").value:"",status:$("fc").value==="missioni"?$("fst").value:"",icon:$("fi").value.trim(),body:$("fb").value,img:old?.img||"",updated:Date.now()};
  try{
    const f=$("ff").files[0];
    if(f&&assets){const r=await assets.upload(f);data.img=r.id}
    const col=db.collection("entries");
    if(editId)await col.doc(editId).set(data);else{const r=await col.add(data);cur=r?.id||null}
    $("dlg").close();
  }catch(e){say("Salvataggio non riuscito: "+(e.message||e.code||e))}
};
async function del(id){
  const e=entries.find(x=>x.id===id);
  if(!await ask(`Eliminare “${e.name}”? L'operazione non si può annullare.`))return;
  try{await db.collection("entries").doc(id).delete();cur=null;render()}catch(err){say("Eliminazione non riuscita: "+(err.message||err.code||err))}
}

const b64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function unlock(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(ENC.salt),iterations:ENC.it,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(ENC.iv)},key,b64(ENC.ct));
  const o=JSON.parse(new TextDecoder().decode(pt));
  IMG=o.IMG;DATA=o.DATA;canWrite=false;
  applyConfig(DATA.config);entries=DATA.entries;pins=DATA.pins;mapImg=DATA.mapImg;
  $("st").textContent="Copia di sola lettura, aggiornata all'8 ottobre 2026";
  render();$("lock").style.display="none";
}
async function tryPw(pw,remember){
  $("pwe").textContent="";$("go").disabled=true;
  try{await unlock(pw);if(remember){try{localStorage.setItem("pwk",pw)}catch(e){}}return true}
  catch(e){$("pwe").textContent="Parola d'ordine non corretta.";try{localStorage.removeItem("pwk")}catch(_){}return false}
  finally{$("go").disabled=false}
}
$("shw").onchange=()=>{$("pw").type=$("shw").checked?"text":"password";$("pw").focus()};
$("go").onclick=()=>tryPw($("pw").value,$("rem").checked);
$("pw").addEventListener("keydown",ev=>{if(ev.key==="Enter")$("go").click()});
(()=>{let p=null;try{p=localStorage.getItem("pwk")}catch(e){}if(p)tryPw(p,true)})();
</script>
